spring:
  application:
    name: parser

server:
  port: 8080

parser:
  # Backstop, не основной лимит. Go режет загрузку строже (32 МБ) и делает это на
  # периметре; здесь потолок выше, чтобы сайдкар не лёг, если Go пропустит.
  # Совпадать они не должны: одинаковые пороги ловят одну ошибку дважды.
  max-body-bytes: 52428800